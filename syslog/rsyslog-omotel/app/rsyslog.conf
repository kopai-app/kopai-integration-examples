# Minimal rsyslog config: read from /dev/log, export directly to Kopai
# via OTLP/HTTP using the native omotel output module.
# No OpenTelemetry Collector required.

module(load="imuxsock")
module(load="omotel")

# Template that outputs the full log message text (programname + msg).
template(name="msg-only" type="string" string="%syslogtag%%msg:::drop-last-lf%")

# Forward all logs directly to Kopai via OTLP/HTTP.
*.* action(
    type="omotel"
    endpoint="http://host.docker.internal:4318"
    path="/v1/logs"
    protocol="http/json"
    template="msg-only"
    batch.max_items="100"
    batch.timeout.ms="2000"
    resource="{ \"service.name\": \"syslog-omotel-demo\", \"deployment.environment\": \"docker-compose-demo\" }"
    retry.max_retries="10"
    retry.initial.ms="1000"
    retry.max.ms="30000"
)
