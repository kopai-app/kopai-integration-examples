# Minimal rsyslog config: read from /dev/log, forward everything to
# the OpenTelemetry Collector over TCP (RFC 3164).

module(load="imuxsock")

# Disable local file logging — we only forward to the collector.
*.* action(
    type="omfwd"
    target="otel-collector"
    port="54527"
    protocol="tcp"
    action.resumeRetryCount="10"
    queue.type="linkedList"
    queue.size="10000"
)
